name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monitor
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://monitor:monitor@127.0.0.1:54329/monitor
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-placeholder-password
      ADMIN_API_TOKEN: ci-placeholder-api-token
      ADMIN_SESSION_SECRET: ci-placeholder-session-secret-32bytes!!
      RUN_DB_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database migrations
        run: pnpm db:migrate && pnpm db:seed

      - name: Check migration metadata and schema drift
        run: pnpm db:check

      - name: Audit public-release safety
        run: pnpm audit:open-source -- --history

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Evaluate content rules
        run: pnpm content:evaluate

      - name: Evaluate event rule examples
        run: pnpm event:evaluate

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck start.sh uninstall.sh scripts/test-upgrade.sh scripts/backup-db.sh scripts/restore-db.sh scripts/check-schema-drift.sh

      - name: Verify first-run credentials
        run: |
          tmp_dir="$(mktemp -d)"
          cp start.sh .env.example "$tmp_dir/"
          (cd "$tmp_dir" && bash start.sh init)
          grep -qx 'ADMIN_USERNAME=admin' "$tmp_dir/.env"
          grep -qx 'ADMIN_PASSWORD=admin@123' "$tmp_dir/.env"
          ! grep -q '__GENERATE__\|__GEN__' "$tmp_dir/.env"
          session_secret="$(sed -n 's/^ADMIN_SESSION_SECRET=//p' "$tmp_dir/.env")"
          test -n "$session_secret"
          test "$session_secret" != 'admin@123'
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          COMPOSE_PROFILES=wechat,trendradar docker compose config --quiet
          docker compose -f docker-compose.lite.yml config --quiet
          JIANWEI_IMAGE_TAG=ci-placeholder docker compose -f docker-compose.yml -f docker-compose.images.yml config --quiet

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: validate
    env:
      POSTGRES_PASSWORD: monitor
      JIANWEI_DOMAIN: localhost
      ACME_EMAIL: smoke@example.invalid
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: smoke-test-password
      ADMIN_API_TOKEN: smoke-test-token
      ADMIN_SESSION_SECRET: smoke-test-session-secret-32bytes!!
      DATABASE_URL: postgres://monitor:monitor@postgres:5432/monitor
      WERSS_BASE_URL: http://werss:8001
      BRAVE_API_KEY: placeholder
      X_BEARER_TOKEN: placeholder
      SUPERGROK_REFRESH_TOKEN: placeholder
      TRENDRADAR_REFRESH_TOKEN: placeholder
      SUMMARY_PROVIDER: ""
      BUDGET_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Verify health endpoints
        run: |
          healthy=0
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/health; then
              healthy=1
              break
            fi
            sleep 3
          done
          test "$healthy" -eq 1
      - name: Verify login page
        run: curl -sf http://localhost:3000/admin | grep -q "登录" && echo "Login page OK"
      - name: Verify model receipt maintenance CLI
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml run --rm --no-deps migrate pnpm model:receipts list
      - name: Verify backup and restore round trip
        run: |
          backup_dir="$(mktemp -d)"
          docker compose exec -T postgres psql -U monitor -d monitor -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE backup_restore_probe (value text PRIMARY KEY);
          INSERT INTO backup_restore_probe VALUES ('restore-ok');
          SQL
          ./scripts/backup-db.sh "$backup_dir"
          backup_file="$(find "$backup_dir" -maxdepth 1 -name 'jianwei-*.dump' -type f | head -1)"
          test -n "$backup_file"
          docker compose exec -T postgres psql -U monitor -d monitor -v ON_ERROR_STOP=1 \
            -c 'DROP TABLE backup_restore_probe'
          printf 'YES\n' | ./scripts/restore-db.sh "$backup_file"
          restored="$(docker compose exec -T postgres psql -U monitor -d monitor -Atc \
            'SELECT value FROM backup_restore_probe')"
          test "$restored" = 'restore-ok'
          docker compose exec -T postgres psql -U monitor -d monitor -v ON_ERROR_STOP=1 \
            -c 'DROP TABLE backup_restore_probe'
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v

  db-upgrade:
    name: DB upgrade test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monitor
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://monitor:monitor@127.0.0.1:54329/monitor
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB upgrade test
        run: bash scripts/test-upgrade.sh

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    env:
      POSTGRES_PASSWORD: monitor
      JIANWEI_DOMAIN: localhost
      ACME_EMAIL: smoke@example.invalid
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TRENDRADAR_REFRESH_TOKEN: placeholder
      E2E_BASE_URL: http://localhost:3000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: smoke-test-password
      ADMIN_API_TOKEN: smoke-test-token
      ADMIN_SESSION_SECRET: smoke-test-session-secret-32bytes!!
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Wait for web
        run: |
          healthy=0
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
