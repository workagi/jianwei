name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Only stable semantic versions are released');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (tag !== `v${pkg.version}`) throw new Error('Tag and package version differ');
          if (!fs.existsSync(`docs/releases/${tag}.md`)) throw new Error('Missing reviewed release notes');
          JS
          git merge-base --is-ancestor HEAD origin/main
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          result="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --event push --limit 10 --json conclusion --jq 'map(select(.conclusion == "success")) | length')"
          test "$result" -gt 0

  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: web
            target: runner
          - component: worker
            target: worker-runner
          - component: migrate
            target: tools
          - component: werss
            target: ""
            context: ./infra/werss
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "见微 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
