ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# pnpm 10 reads workspace-wide overrides from this file. Keeping them in
# package.json is silently ignored and would reintroduce vulnerable transitive
# versions on a fresh machine.
overrides:
  "@next/eslint-plugin-next@16.3.6>fast-glob": "-"
  "esbuild@<=0.24.2": 0.25.12
  "postcss@<8.5.23": 8.5.23
  "nanoid@<3.3.18": 3.3.18
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "sharp@<0.35.4": 0.35.4
  "browserslist@<4.28.7": 4.28.7
  "baseline-browser-mapping@<2.11.0": 2.11.0

# Replace the plugin's sole globSync call; retain directory matching semantics.
packageExtensions:
  "@next/eslint-plugin-next@16.3.6":
    dependencies:
      tinyglobby: 0.2.17

patchedDependencies:
  "@next/eslint-plugin-next@16.3.6": patches/@next__eslint-plugin-next@16.3.6.patch
